<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3ee"><title>六级真题词典</title><style>
:root{--bg:#f5f3ee;--card:#fffefb;--ink:#171714;--muted:#747168;--line:#e7e2d8;--accent:#1f5f4a;--accent2:#e8f0ec;--warn:#9a5b20;--bad:#9c3737;--soft:#ece9e1;--shadow:0 12px 36px rgba(35,31,24,.08)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}.app{max-width:980px;margin:auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.92);backdrop-filter:blur(14px);padding:16px 20px 11px;border-bottom:1px solid rgba(231,226,216,.8)}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:20px;margin:0}.brandRight{display:flex;align-items:center;gap:8px}.brand small{color:var(--muted)}.syncDot{width:9px;height:9px;border-radius:99px;background:#aaa;display:inline-block}.syncDot.ok{background:#2f7d5e}.syncDot.busy{background:#c58a27}.syncDot.err{background:#a74343}main{padding:22px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.learn-card{min-height:480px;padding:30px;display:flex;flex-direction:column}.source{font-size:12px;color:var(--muted);letter-spacing:.04em}.word{font-family:Georgia,serif;font-size:46px;line-height:1.15;margin:36px 0 10px;word-break:break-word}.speaker{border:0;background:transparent;font-size:22px;cursor:pointer}.timer{font-size:13px;color:var(--muted)}.recall-actions,.rate-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:auto}.rate-actions{grid-template-columns:repeat(4,1fr)}.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.good{background:var(--accent);color:white}.btn.fuzzy{background:#f3e3c8;color:#704311}.btn.wrong{background:#f2d9d7;color:#7f2d2d}.btn.unknown{background:#dedad1;color:#3f3c36}.answer{display:none;margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.answer.show{display:block}.meaning{font-size:18px;line-height:1.8}.section{margin-top:20px;padding:18px;background:#faf8f3;border:1px solid var(--line);border-radius:16px}.section h3{font-size:14px;margin:0 0 9px;color:var(--muted)}.section p{margin:0;line-height:1.75}.note{font-size:13px;color:var(--muted)}.progress-row{display:flex;gap:12px;align-items:center;margin-bottom:14px}.bar{height:8px;background:#e7e3da;border-radius:99px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}.pill{font-size:12px;background:var(--soft);border-radius:99px;padding:6px 9px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,254,251,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30}.tabs button{width:min(19%,180px);border:0;background:transparent;padding:12px 6px max(18px,env(safe-area-inset-bottom));color:var(--muted);cursor:pointer}.tabs button.active{color:var(--accent);font-weight:700}.searchbox{display:flex;gap:10px}.searchbox input{flex:1;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:white}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--line);background:white;padding:8px 11px;border-radius:99px;cursor:pointer}.chip.active{background:var(--ink);color:white}.result{padding:16px 2px;border-bottom:1px solid var(--line);cursor:pointer}.result b{font-family:Georgia,serif;font-size:21px}.result .m{margin-top:5px;color:#403d38}.result .meta{font-size:12px;color:var(--muted);margin-top:6px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px}.stat strong{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted)}.table{margin-top:16px}.row{display:grid;grid-template-columns:1.4fr .7fr .7fr .8fr;gap:10px;padding:14px 8px;border-bottom:1px solid var(--line);align-items:center}.row.head{font-size:12px;color:var(--muted)}.tag{font-size:12px;border-radius:99px;padding:5px 8px;background:var(--soft);display:inline-block}.tag.bad{background:#f2d9d7;color:#7f2d2d}.tag.fuzzy{background:#f3e3c8;color:#704311}.group{padding:18px;margin-bottom:12px}.group h3{margin:0 0 8px}.group .words{font-family:Georgia,serif;font-size:22px;margin-bottom:10px}.detail{padding:26px}.detail .word{margin:4px 0 10px}.back{margin-bottom:16px}.settings .card{padding:20px;margin-bottom:14px}.settings label{display:flex;justify-content:space-between;gap:20px;align-items:center}.settings input[type=number]{width:90px;padding:8px;border:1px solid var(--line);border-radius:10px}.empty{padding:42px;text-align:center;color:var(--muted)}
.authWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.authCard{width:min(460px,100%);padding:28px}.authCard h1{margin:0 0 6px}.authCard p{color:var(--muted);line-height:1.65}.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:white}.authActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.authMsg{min-height:24px;margin-top:12px;font-size:13px;color:var(--bad)}.cloudBox{display:flex;gap:10px;align-items:flex-start}.cloudBox strong{display:block;margin-bottom:4px}.accountEmail{font-weight:700;word-break:break-all}.setupCode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f0ede6;border-radius:8px;padding:2px 6px}.hidden{display:none!important}
@media(max-width:700px){main{padding:14px}.learn-card{min-height:calc(100vh - 190px);padding:22px}.word{font-size:39px;margin-top:28px}.rate-actions{grid-template-columns:repeat(2,1fr)}.stats-grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1.2fr .6fr .6fr}.row>*:last-child{display:none}.authActions{grid-template-columns:1fr}}

.app{padding-bottom:85px}.view{display:none}.view.active{display:block}.result{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0}.resultmeaning{display:block;margin-top:5px;line-height:1.55;color:var(--ink)}.result small{display:block;margin-top:6px;color:var(--muted)}.search-intro{margin:8px 0 20px}.search-intro h2{margin:0 0 4px;font-size:25px}.muted,#resultCount{color:var(--muted);font-size:13px}.searchbox{margin-top:14px}.detailtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.heading{display:flex;align-items:center;gap:12px}.heading .word{font-size:clamp(32px,7vw,48px);margin:15px 0}.detail .meaning{border-top:1px solid var(--line);padding-top:18px}.navwords{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 25px;position:sticky;bottom:74px;background:rgba(245,243,238,.98);padding:12px 0}.arrow{min-width:125px;background:var(--ink);color:#fff;border-color:var(--ink);font-weight:650}.arrow:disabled{background:var(--soft);border-color:var(--soft);color:var(--muted)}.position{color:var(--muted);font-size:13px;white-space:nowrap}.tabs button{width:min(33%,240px)}.detail .section a{color:var(--accent)}@media(max-width:700px){.detail{padding:20px}.arrow{min-width:107px;padding:13px 8px}.navwords{bottom:68px}.brand h1{font-size:18px}}

/* 连续查词：词条顶部和手机固定底栏均能看到上一词/下一词 */
#detail.active{padding-bottom:106px}
.browse-hint{font-size:12px;color:var(--muted);margin:4px 0 10px;line-height:1.6}
.navwords--top{position:static;margin:10px 0 18px;padding:0;background:transparent}
.navwords--floating{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;width:min(940px,calc(100vw - 24px));z-index:25;background:rgba(255,254,251,.97);border:1px solid var(--line);border-radius:18px;padding:11px 14px;margin:0;box-shadow:0 5px 28px rgba(26,26,25,.15);backdrop-filter:blur(12px)}
.browse-start{width:100%;display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;background:var(--accent2);color:var(--accent);border-color:transparent;font-weight:650}
.navwords .arrow{flex:0 0 auto;min-width:130px}
@media(max-width:700px){.navwords--floating{bottom:65px;gap:8px;padding:8px 10px;border-radius:16px}.navwords .arrow{min-width:96px;flex:1;padding:14px 5px;font-size:14px}.navwords .position{font-size:12px}.navwords--top .arrow{font-size:13px}.navwords--top{margin-bottom:14px}#detail.active{padding-bottom:105px}}
@media(max-width:380px){.navwords--floating{gap:5px;padding:7px}.navwords .arrow{min-width:82px;padding:12px 3px;font-size:12px}.navwords .position{font-size:11px;white-space:normal;text-align:center;line-height:1.25}}
</style></head><body>
<div id="setupScreen" class="authWrap hidden"><div class="card authCard"><h1>六级真题词典</h1><p>云端连接尚未配置或脚本加载失败，请检查 config.js 与网络。</p></div></div>
<div id="authScreen" class="authWrap hidden"><div class="card authCard"><h1>六级真题词典</h1><p>登录后查词，收藏会自动保存在云端。</p><div class="field"><label>邮箱</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>密码</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="至少 6 位"></div><div class="authActions"><button id="signInBtn" class="btn primary">登录</button><button id="signUpBtn" class="btn">注册账号</button></div><div id="authMsg" class="authMsg"></div></div></div>
<div id="appRoot" class="app hidden"><header class="top"><div class="brand"><h1>六级真题词典</h1><div class="brandRight"><span id="syncDot" class="syncDot"></span><small id="syncText">准备同步</small></div></div></header><main>
<section id="search" class="view active"><div class="search-intro"><h2>查词</h2><div class="muted">搜索定位单词 · 左右箭头始终翻阅完整总词表</div></div><div class="searchbox"><input id="q" placeholder="搜索英文、词组或中文释义…" aria-label="搜索词条"><button class="btn" id="searchBtn">查看词条</button></div><div id="filters" class="filters"></div><div id="resultCount"></div><div id="results"></div></section>
<section id="detail" class="view"><div id="detailMount"></div></section>
<section id="groups" class="view"><div id="groupsMount"></div></section>
<section id="settings" class="view settings"><div class="card"><h3>云端账号与收藏</h3><div id="accountEmail" class="accountEmail"></div><p id="accountStatus" class="note"></p><button class="btn" id="syncNowBtn">立即同步</button> <button class="btn" id="signOutBtn">退出登录</button></div><div class="card note">词条沿用原词库内容；保留中文释义、词源、搭配、相似词与辨析。</div></section>
</main><nav class="tabs"><button class="active" data-v="search">查词</button><button data-v="groups">辨析</button><button data-v="settings">我的</button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="data.js"></script><script src="app.js"></script></body></html>
